name: Build notes

on:
  push:
    branches: [main]
    paths:
      - "notes/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build notes.json
        run: |
          pip install markdown
          python tools/build_notes.py

      - name: Commit notes.json if it changed
        run: |
          if git diff --quiet -- notes.json; then
            echo "notes.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes.json
          git commit -m "Rebuild notes.json"
          git push
